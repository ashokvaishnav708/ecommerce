services:
  app:
    build:
      context: .
      dockerfile: ./Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - CHOKIDAR_USEPOLLING=1
    container_name: ecommerce-app
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.nuxt
    stdin_open: true
    tty: true
